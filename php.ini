allow_url_fopen = Off
display_errors = Off
enable_dl = Off
error_log = "error_log"
file_uploads = Off
log_errors = Off
max_execution_time = 2
max_input_time = 2
max_input_vars = 10
memory_limit = 8M
post_max_size = 1M
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/ea-php81"
upload_max_filesize = 1M
zlib.output_compression = Off
